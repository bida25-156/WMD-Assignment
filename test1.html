*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
}

/* BROWSER TOP */

.browser-top{
    border:2px solid #444;
    border-bottom:none;
    padding:15px 20px;
    background:#f5f5f5;
}

.browser-title{
    width:170px;
    border:2px solid #999;
    padding:8px;
    font-size:14px;
}

/* URL BAR */

.url-bar{
    border:2px solid #444;
    border-top:none;
    padding:15px;
    background:#f5f5f5;
}

.url{
    border:2px solid #ccc;
    padding:10px;
    color:#666;
}

/* NAVIGATION */

nav{
    border:2px solid #444;
    border-radius:0 0 15px 15px;
    padding:20px;
    display:flex;
    gap:30px;
    align-items:center;
    background:#f5f5f5;
}

.nav-logo,
.nav-btn{
    border:2px solid #444;
    padding:12px 30px;
    background:white;
    font-weight:bold;
}

.container{
    width:90%;
    margin:30px auto;
}

/* TOP CONTENT */

.top-section{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:40px;
}

.left-content{
    width:60%;
}

.title-box{
    width:180px;
    border:2px solid #444;
    text-align:center;
    padding:10px;
    margin-bottom:20px;
    font-weight:bold;
    background:white;
}

/* IMAGE PLACEHOLDER */

.image-placeholder{
    width:100%;
    max-width:600px;
    height:300px;
    border:2px solid #444;
    position:relative;
    background:#f9f9f9;
}

/* X LINES */

.image-placeholder::before,
.image-placeholder::after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#444;
    top:50%;
    left:0;
    transform-origin:center;
}

.image-placeholder::before{
    transform:rotate(28deg);
}

.image-placeholder::after{
    transform:rotate(-28deg);
}

.image-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-weight:bold;
}

/* DESCRIPTION */

.description-box{
    width:250px;
    height:160px;
    border:2px solid #444;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    text-align:center;
    padding:20px;
    font-weight:bold;
}

/* HEADER */

.middle-header{
    width:300px;
    margin:0 auto 40px;
    border:2px solid #444;
    text-align:center;
    padding:12px;
    background:white;
    font-weight:bold;
}

/* CARDS */

.cards{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    width:180px;
    text-align:center;
}

/* CARD IMAGE PLACEHOLDER */

.card-image{
    width:100%;
    height:240px;
    border:2px solid #444;
    position:relative;
    background:#f9f9f9;
}

.card-image::before,
.card-image::after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#444;
    top:50%;
    left:0;
    transform-origin:center;
}

.card-image::before{
    transform:rotate(60deg);
}

.card-image::after{
    transform:rotate(-60deg);
}

/* BUTTON */

.card-btn{
    margin-top:20px;
    border:2px solid #444;
    padding:15px;
    background:white;
    font-weight:bold;
}

/* FOOTER */

footer{
    border:2px solid #444;
    border-radius:15px 15px 0 0;
    margin-top:120px;
    padding:40px;
    text-align:center;
    background:#f5f5f5;
}

.footer-box{
    display:inline-block;
    border:2px solid #444;
    padding:15px 40px;
    background:white;
    font-weight:bold;
}

</style>
</head>
